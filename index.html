<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服計時器工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .tool-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
            text-align: center;
        }

        .tool-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .tool-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }

        .tool-title {
            font-size: 32px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .tool-description {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .tool-features {
            list-style: none;
            margin-bottom: 30px;
            text-align: left;
        }

        .tool-features li {
            padding: 12px 0;
            color: #555;
            font-size: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .tool-features li:last-child {
            border-bottom: none;
        }

        .tool-button {
            display: inline-block;
            padding: 18px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            border-radius: 10px;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .tool-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .tool-card {
                padding: 30px;
            }

            .tool-icon {
                font-size: 60px;
            }

            .tool-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ 客服計時器工具</h1>
            <p>專業的客服輔助工具，提升工作效率</p>
        </div>

        <a href="customer-service-timer.html" class="tool-card">
            <div class="tool-icon">⏰</div>
            <div class="tool-title">客服計時器</div>
            <div class="tool-description">
                追蹤客戶查詢的雙階段計時器，自動提醒回覆時間，支持多賽事和多注單管理，並可導入JSON數據。
            </div>
            <ul class="tool-features">
                <li>✅ 雙階段計時（9分鐘×2）</li>
                <li>✅ 多注單號支持</li>
                <li>✅ 多賽事自動分組</li>
                <li>✅ JSON數據導入</li>
                <li>✅ 中英韓三語提醒</li>
                <li>✅ 彈窗提醒系統</li>
            </ul>
            <span class="tool-button">開始使用 →</span>
        </a>

        <div class="footer">
            <p>© 2025 客服計時器工具 | 純前端工具，無需服務器</p>
        </div>
    </div>
</body>
</html>
